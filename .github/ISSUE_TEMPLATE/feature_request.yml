name: "Feature Request"
description: "Suggest an idea or enhancement for agy-cli-account-swarm"
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Have an idea to improve the orchestrator? We'd love to hear it!"
  - type: textarea
    id: feature-description
    attributes:
      label: "Feature Description"
      description: "Explain the proposed feature clearly and why it is useful."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Any alternative solutions or features you've considered?"
    validations:
      required: false
