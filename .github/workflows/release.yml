name: Release Build & Packaging

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Installer & Portable ZIP
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: '9.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Run Unit Tests
        run: dotnet test --verbosity normal

      - name: Publish Binaries
        run: dotnet publish AgyAccountSwarm.csproj -c Release -o publish --nologo

      - name: Extract Tag Name & Version
        id: vars
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          $isBeta = $tag -match "beta|alpha|rc"
          echo "IS_PRERELEASE=$isBeta" >> $env:GITHUB_OUTPUT

      - name: Compile Windows Inno Setup Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          iscc "/Qp" scripts/installer.iss

      - name: Package Windows Portable ZIP
        shell: pwsh
        run: |
          $ver = "${{ steps.vars.outputs.VERSION }}"
          Compress-Archive -Path publish/* -DestinationPath "dist/Agy-CLI-Account-Swarm-v$ver-win-x64.zip" -CompressionLevel Optimal

      - name: Compute SHA256 Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path dist -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" -and $_.Extension -match "exe|zip" }
          $lines = [System.Collections.Generic.List[string]]::new()
          foreach ($f in $files) {
            $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLower()
            $lines.Add("$hash  $($f.Name)")
          }
          [System.IO.File]::WriteAllLines("dist/SHA256SUMS.txt", $lines)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87238604da99376a6cb63 # v2.2.1
        with:
          name: "Agy CLI Account Swarm ${{ steps.vars.outputs.TAG }}"
          tag_name: ${{ steps.vars.outputs.TAG }}
          prerelease: ${{ steps.vars.outputs.IS_PRERELEASE == 'True' }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
