name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Publish Binaries
      run: dotnet publish -c Release -r win-x64 --self-contained false -o release-dist

    - name: Archive Artifacts
      shell: pwsh
      run: Compress-Archive -Path release-dist/* -DestinationPath agy-account-swarm-win-x64.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: agy-account-swarm-win-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
