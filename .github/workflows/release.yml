name: Release Build & Packaging

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Installer & Portable ZIP
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: '9.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Run Unit Tests
        run: dotnet test --verbosity normal

      - name: Extract Tag Name & Version
        id: vars
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          $isBeta = $tag -match "beta|alpha|rc"
          echo "IS_PRERELEASE=$isBeta" >> $env:GITHUB_OUTPUT

      - name: Build Multiplatform Packages (Windows, Linux, macOS x64/ARM64)
        shell: pwsh
        run: |
          & ./scripts/build-installer.ps1 -Version "${{ steps.vars.outputs.VERSION }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Agy CLI Account Swarm ${{ steps.vars.outputs.TAG }}"
          tag_name: ${{ steps.vars.outputs.TAG }}
          prerelease: ${{ steps.vars.outputs.IS_PRERELEASE == 'True' }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
